<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visualise your internet requests</title>
    <meta
      name="description"
      content="An interactive 3D globe that shows how an internet request travels from your device to a server, over 5G/fibre or Starlink."
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#story-host">Skip to route explanation</a>

    <!-- Full-bleed: space runs edge to edge at any window size, and the globe is
         framed inside it by #globe-focus rather than by the canvas bounds. -->
    <canvas
      id="globe-canvas"
      tabindex="0"
      role="application"
      aria-label="Interactive 3D globe of Earth in space. Drag or use the arrow keys to orbit, scroll or press plus and minus to zoom, and tap a populated location to select it as a request's origin or destination."
    ></canvas>

    <div class="ui">
      <header class="site-header">
        <h1>Visualise your internet requests</h1>
      </header>

      <aside id="control-host" aria-label="Route controls">
        <!-- Part of the sidebar's flex layout, not floated off its edge: this
             strip never scrolls and never overflows, so the collapse control
             stays reachable at any viewport height. -->
        <div class="sidebar-rail">
          <nav class="rail-nav" aria-label="Primary">
            <a class="rail-link" href="./" aria-current="page">
              <span class="rail-glyph" aria-hidden="true">◉</span>
              <span class="rail-label">Globe</span>
            </a>
            <a class="rail-link" href="./about.html">
              <span class="rail-glyph" aria-hidden="true">i</span>
              <span class="rail-label">About</span>
            </a>
          </nav>
        </div>
        <div class="control-host-inner">
          <p class="hint" id="page-hint">Drag to rotate · scroll to zoom · tap a city to select it</p>
          <div id="control-panel-host"></div>
          <!-- The disclaimer is always visible; the per-dataset attributions sit
               behind a disclosure so they cannot crowd out the globe on a phone. -->
          <p class="data-note">Routes are simplified illustrations of real infrastructure, not live traceroutes.</p>
          <details class="data-sources">
            <summary>Where this data comes from</summary>
            <p id="data-note" role="status" aria-live="polite"></p>
          </details>
        </div>
      </aside>

      <div class="stage-column">
        <!-- Layout anchor only: CSS decides where the globe should be centred,
             and the renderer reads this element's box each resize. -->
        <div id="globe-focus" aria-hidden="true"></div>
        <div id="prompt-host"></div>
      </div>

      <aside id="story-host" aria-label="Journey of the request"></aside>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
